# Test data for smca_bank_types.py
#
# One mux variant per SMCA bank type, so the per-bank test methods
# (test_sysfs_name, test_decode) run individually for each bank type - each
# reports its own PASS/FAIL/CANCEL. Mirrors the kernel SMCA tables:
#   smca_hwid_mcatypes[]  -> hwid, mcatype   (arch/x86/kernel/cpu/mce/amd.c)
#   smca_names[]          -> sysfs (short) name
#   smca_long_names[]     -> longname (decoder, drivers/edac/mce_amd.c)
#
# longname is null where the kernel provides no decode long name (ma_llc,
# usr_cp, usr_dp) or the type is special (reserved); test_decode CANCELs those.
# Node names are unique labels shown in each variant's test id (e.g. ...;cs_v2).
#
# 'status' (outside the mux, applies to every variant) is the MCi_STATUS value
# used for the software (decode-only) injection; the injector sets the VAL bit
# automatically. It stays a corrected (non-UC) error - "Corrected error, no
# action required." - but sets a non-zero XEC (bit 16 => xec=1). The non-zero
# XEC is required so UMC banks skip decode_smca_error()'s DRAM-ECC path
# (decode_dram_ecc/amd64_edac), which WARNs on a synthetic error with no real
# DIMM/address. Non-zero xec is harmless for all other bank types.

status: 0x10000

bank: !mux
    cs:
        hwid: 0x2E
        mcatype: 0x0
        sysfs: coherent_station
        longname: "Coherent Station"
