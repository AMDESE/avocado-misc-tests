type: 'upstream'
location: 'https://github.com/torvalds/linux/archive/v6.16.zip'
kself_args: 'summary=1'

component: !mux
    #The Bus Lock Threshold feature helps hypervisors limit guests from issuing excessive bus locks, preventing system slowdowns that affect all tenants.
    #The feature is supported starting with AMD EPYC ZEN 5 processors and is available from Linux kernel v6.16 onwards.
    #The kernel config option KVM_CAP_X86_BUS_LOCK_EXIT must be enabled.
    kvm_buslock_test:
      comp: 'kvm'
      subcomp_test: 'kvm:kvm_buslock_test'
    cpufreq:
      comp: "cpufreq"
      test_modes: !mux
        basic:
          test_mode: "basic"
        sptest1:
          test_mode: "sptest1"
        sptest2:
          test_mode: "sptest2"
    amd-pstate:
      comp: "amd-pstate"
      tests: !mux
      basic:
        test: "basic"
